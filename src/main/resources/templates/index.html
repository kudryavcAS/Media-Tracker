<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Media Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .clickable-row { cursor: pointer; }
        .sort-link { text-decoration: none; color: black; font-weight: 600; display: block; }
        .sort-link:hover { color: #0d6efd; }
        .active-sort { color: #0d6efd; text-decoration: underline; }
    </style>
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold">Моё зриво</h1>
    <div>
        <a href="/add/movie" class="btn btn-primary me-2">+ Фильм</a>
        <a href="/add/series" class="btn btn-success">+ Сериал</a>
    </div>
</div>

<div class="card mb-4 p-2 bg-light">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${currentType == 'ALL' ? 'active' : ''}"
                   th:href="@{/(type='ALL', status=${currentStatus}, sort=${currentSort})}">Всё</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${currentType == 'MOVIE' ? 'active' : ''}"
                   th:href="@{/(type='MOVIE', status=${currentStatus}, sort=${currentSort})}">Фильмы</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${currentType == 'SERIES' ? 'active' : ''}"
                   th:href="@{/(type='SERIES', status=${currentStatus}, sort=${currentSort})}">Все сериалы</a>
            </li>
            <li class="nav-item ms-2 border-start ps-2"></li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${currentType == 'ANIME' ? 'active' : ''}"
                   th:href="@{/(type='ANIME', status=${currentStatus}, sort=${currentSort})}">Аниме</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${currentType == 'ANIMATION' ? 'active' : ''}"
                   th:href="@{/(type='ANIMATION', status=${currentStatus}, sort=${currentSort})}">Мульт</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${currentType == 'LIVE_ACTION' ? 'active' : ''}"
                   th:href="@{/(type='LIVE_ACTION', status=${currentStatus}, sort=${currentSort})}">Реалы</a>
            </li>
        </ul>

        <form id="statusForm" action="/" method="get" class="d-flex align-items-center">
            <input type="hidden" name="type" th:value="${currentType}">
            <input type="hidden" name="sort" th:value="${currentSort}">

            <select name="status" class="form-select form-select-sm" style="width: 150px;" onchange="document.getElementById('statusForm').submit()">
                <option value="ALL" th:selected="${currentStatus == 'ALL'}">Любой статус</option>
                <option th:each="st : ${T(com.tracker.mediatracker.model.WatchStatus).values()}"
                        th:value="${st.name()}"
                        th:text="${st.title}"
                        th:selected="${currentStatus == st.name()}">
                </option>
            </select>
        </form>

        <div th:if="${currentType != 'ALL' or currentStatus != 'ALL' or currentSort != null}">
            <a href="/" class="btn btn-outline-danger btn-sm">✕</a>
        </div>
    </div>
</div>

<table class="table table-hover align-middle">
    <thead class="table-light">
    <tr>
        <th>
            <a class="sort-link" th:classappend="${currentSort == 'type' ? 'active-sort' : ''}"
               th:href="@{/(type=${currentType}, status=${currentStatus}, sort='type')}">Тип</a>
        </th>
        <th>
            <a class="sort-link" th:classappend="${currentSort == 'title' ? 'active-sort' : ''}"
               th:href="@{/(type=${currentType}, status=${currentStatus}, sort='title')}">Название</a>
        </th>
        <th>
            <a class="sort-link" th:classappend="${currentSort == 'year' ? 'active-sort' : ''}"
               th:href="@{/(type=${currentType}, status=${currentStatus}, sort='year')}">Год</a>
        </th>
        <th>
            <a class="sort-link" th:classappend="${currentSort == 'director' ? 'active-sort' : ''}"
               th:href="@{/(type=${currentType}, status=${currentStatus}, sort='director')}">Режиссёр</a>
        </th>
        <th>
            <a class="sort-link" th:classappend="${currentSort == 'duration' ? 'active-sort' : ''}"
               th:href="@{/(type=${currentType}, status=${currentStatus}, sort='duration')}">Общее время</a>
        </th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>

    <tbody th:each="item : ${items}">
    <tr class="clickable-row"
        data-bs-toggle="collapse"
        th:data-bs-target="'#details-' + ${item.id}">

        <td>
            <span th:if="${item instanceof T(com.tracker.mediatracker.model.Movie)}" class="badge bg-primary">Фильм</span>
            <span th:if="${item instanceof T(com.tracker.mediatracker.model.Series)}" class="badge bg-success" th:text="${item.seriesType.title}"></span>
        </td>

        <td class="fw-bold">
            <span th:text="${item.title}"></span>
            <div th:if="${item instanceof T(com.tracker.mediatracker.model.Series)}" class="progress mt-1" style="height: 5px; width: 100px;">
                <div class="progress-bar bg-success" role="progressbar"
                     th:style="'width: ' + (${item.totalEpisodes} > 0 ? (${item.watchedEpisodes} * 100 / ${item.totalEpisodes}) : 0) + '%'"></div>
            </div>
        </td>

        <td th:text="${item.releaseYear}"></td>
        <td th:text="${item.directors}"></td>
        <td>
            <span th:text="${item.durationMinutes}"></span> мин.
        </td>

        <td>
                    <span class="badge"
                          th:classappend="${item.status.name() == 'COMPLETED' ? 'bg-secondary' : (item.status.name() == 'WATCHING' ? 'bg-warning text-dark' : 'bg-info text-dark')}"
                          th:text="${item.status.title}"></span>
        </td>

        <td onclick="event.stopPropagation()">
            <a th:href="@{'/edit/' + ${item.id}}" class="btn btn-sm btn-outline-primary" title="Редактировать">
                <i class="bi bi-pencil-fill"></i>
            </a>
            <a th:href="@{'/delete/' + ${item.id}}" class="btn btn-sm btn-outline-danger" title="Удалить"
               onclick="return confirm('Вы уверены, что хотите удалить эту запись?')">
                <i class="bi bi-trash-fill"></i>
            </a>
        </td>
    </tr>

    <tr th:if="${item instanceof T(com.tracker.mediatracker.model.Series)}"
        th:id="'details-' + ${item.id}" class="collapse bg-light">
        <td colspan="7">
            <div class="p-3 border-start border-4 border-success">
                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h5>Прогресс просмотра</h5>
                        <div class="d-flex align-items-center gap-3">
                            <form th:action="@{'/series/' + ${item.id} + '/dec'}" method="post">
                                <button class="btn btn-outline-danger btn-sm fw-bold" style="width: 30px;">-</button>
                            </form>

                            <span class="fs-5 fw-bold" th:text="${item.watchedEpisodes} + ' / ' + ${item.totalEpisodes}"></span>

                            <form th:action="@{'/series/' + ${item.id} + '/inc'}" method="post">
                                <button class="btn btn-outline-success btn-sm fw-bold" style="width: 30px;">+</button>
                            </form>
                        </div>
                    </div>

                    <div class="w-50">
                        <div class="progress" style="height: 25px;">
                            <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar"
                                 th:style="'width: ' + (${item.totalEpisodes} > 0 ? (${item.watchedEpisodes} * 100 / ${item.totalEpisodes}) : 0) + '%'"
                                 th:text="${item.totalEpisodes} > 0 ? (${item.watchedEpisodes} * 100 / ${item.totalEpisodes}) + '%' : '0%'">
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${items.isEmpty()}" class="text-center mt-5 text-muted">
    <h4>Список пуст 🦕</h4>
</div>

</body>
</html>
