<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Oops! Error')}">
    <title>Error</title>
</head>
<body class="container mt-5 text-center">

<div class="card shadow-sm mx-auto" style="max-width: 600px;">
    <div class="card-body p-5">
        <h1 class="display-1 text-danger mb-4"><i class="bi bi-exclamation-triangle-fill"></i></h1>
        <h2 class="mb-4">Oops! Something went wrong.</h2>
        <p class="text-muted mb-4">We are already looking into this issue. Please try returning to the main page.</p>

        <div class="alert alert-secondary text-start mb-4" th:if="${errorMessage}">
            <strong>Error details:</strong> <span th:text="${errorMessage}"></span>
        </div>

        <a href="/" class="btn btn-primary px-4 py-2">← Back to Home</a>
    </div>
</div>

</body>
</html>
