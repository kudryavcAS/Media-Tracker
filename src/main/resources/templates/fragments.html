<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <title th:text="${title}">Media Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .clickable-row { cursor: pointer; }
    .sort-link { text-decoration: none; color: black; font-weight: 600; display: block; }
    .sort-link:hover { color: #0d6efd; }
    .active-sort { color: #0d6efd; text-decoration: underline; }
    mark { background-color: #fff3cd; padding: 0; color: #664d03; font-weight: bold; }
    body { background-color: #f8f9fa; }
    .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
  </style>
</head>
