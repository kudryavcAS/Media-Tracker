<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Фильм')}">
</head>
<body class="container mt-5">
<div class="card shadow-sm bg-white">
    <div class="card-header bg-primary text-white">
        <h2 class="mb-0" th:text="${movie.id == null ? 'Добавить новый фильм' : 'Редактировать фильм'}"></h2>
    </div>
    <div class="card-body">
        <form th:action="@{/save/movie}" th:object="${movie}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label fw-bold">Название</label>
                <input type="text" class="form-control" th:field="*{title}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Режиссер(ы)</label>
                <input type="text" class="form-control" th:field="*{directors}">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Год выхода</label>
                    <input type="number" class="form-control" th:field="*{releaseYear}" min="1900" max="2100">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Длительность (минут)</label>
                    <input type="number" class="form-control" th:field="*{durationMinutes}">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Статус</label>
                <select class="form-select" th:field="*{status}">
                    <option th:each="st : ${T(com.tracker.mediatracker.model.WatchStatus).values()}"
                            th:value="${st}" th:text="${st.title}"></option>
                </select>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <div>
                    <a href="/" class="btn btn-secondary">Отмена</a>
                    <a th:if="${movie.id != null}" th:href="@{'/delete/' + ${movie.id}}"
                       class="btn btn-danger ms-2"
                       onclick="return confirm('Вы уверены, что хотите безвозвратно удалить эту запись?')">Удалить</a>
                </div>
                <button type="submit" class="btn btn-primary px-4">Сохранить</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
