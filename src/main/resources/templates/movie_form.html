<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Movie')}">
</head>
<body class="container mt-5">
<div class="card shadow-sm bg-white">
    <div class="card-header bg-primary text-white">
        <h2 class="mb-0" th:text="${movie.id == null ? 'Add New Movie' : 'Edit Movie'}"></h2>
    </div>
    <div class="card-body">
        <form th:action="@{/save/movie}" th:object="${movie}" method="post">

            <input type="hidden" th:field="*{id}">
            <input type="hidden" name="returnUrl" th:value="${returnUrl}">

            <div class="mb-3 position-relative">
                <label class="form-label fw-bold">Title</label>
                <input type="text" id="title" class="form-control"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                       th:field="*{title}" autocomplete="off" required>
                <div id="tmdbResults" class="list-group position-absolute w-100 shadow d-none"
                     style="z-index: 1000; max-height: 250px; overflow-y: auto;"></div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Director(s)</label>
                <input type="text" class="form-control"
                       th:classappend="${#fields.hasErrors('directors')} ? 'is-invalid'" th:field="*{directors}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('directors')}" th:errors="*{directors}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Release Year</label>
                    <input type="number" class="form-control"
                           th:classappend="${#fields.hasErrors('releaseYear')} ? 'is-invalid'" th:field="*{releaseYear}"
                           min="1888" max="2100">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('releaseYear')}"
                         th:errors="*{releaseYear}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Duration (minutes)</label>
                    <input type="number" class="form-control"
                           th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid'"
                           th:field="*{durationMinutes}">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('durationMinutes')}"
                         th:errors="*{durationMinutes}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" th:field="*{status}">
                    <option th:each="st : ${T(com.tracker.mediatracker.model.WatchStatus).values()}"
                            th:value="${st}" th:text="${st.title}"></option>
                </select>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <div>
                    <a th:href="${returnUrl != null and !returnUrl.isEmpty() ? returnUrl : '/'}"
                       class="btn btn-secondary">Cancel</a>
                    <a th:if="${movie.id != null}" th:href="@{'/delete/' + ${movie.id}}"
                       class="btn btn-danger ms-2"
                       onclick="return confirm('Are you sure you want to permanently delete this record?')">Delete</a>
                </div>
                <button type="submit" class="btn btn-primary px-4">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const titleInput = document.getElementById('title');
        const resultsBox = document.getElementById('tmdbResults');
        const directorsInput = document.getElementById('directors');
        const releaseYearInput = document.getElementById('releaseYear');
        const durationInput = document.getElementById('durationMinutes');

        let timeout = null;

        titleInput.addEventListener('input', function () {
            clearTimeout(timeout);
            const query = this.value.trim();
            if (query.length < 2) {
                resultsBox.classList.add('d-none');
                return;
            }
            timeout = setTimeout(async () => {
                try {
                    const response = await fetch(`/api/tmdb/search?query=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    const movies = (data.results || []).filter(item => item.media_type === 'movie' || item.mediaType === 'movie');

                    resultsBox.innerHTML = '';
                    if (movies.length === 0) {
                        resultsBox.classList.add('d-none');
                        return;
                    }

                    movies.forEach(movie => {
                        const yearStr = movie.release_date || movie.releaseDate;
                        const year = yearStr ? yearStr.substring(0, 4) : '';
                        const title = movie.title || movie.name;

                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'list-group-item list-group-item-action';
                        btn.innerHTML = `<strong>${title}</strong> <span class="text-muted">${year ? `(${year})` : ''}</span>`;

                        btn.addEventListener('click', async () => {
                            titleInput.value = title;
                            resultsBox.classList.add('d-none');

                            const res = await fetch(`/api/tmdb/details?id=${movie.id}&type=movie`);
                            const details = await res.json();

                            if (details.releaseYear) releaseYearInput.value = details.releaseYear;
                            if (details.durationMinutes) durationInput.value = details.durationMinutes;
                            if (details.directors) directorsInput.value = details.directors;
                        });
                        resultsBox.appendChild(btn);
                    });
                    resultsBox.classList.remove('d-none');
                } catch (e) {
                    console.error('TMDB search failed', e);
                }
            }, 500);
        });

        document.addEventListener('click', function (e) {
            if (!titleInput.contains(e.target) && !resultsBox.contains(e.target)) {
                resultsBox.classList.add('d-none');
            }
        });
    });
</script>
</body>
</html>
