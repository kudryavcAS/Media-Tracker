<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Добавить сериал</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="card shadow-sm">
  <div class="card-header bg-success text-white">
    <h2 class="mb-0">Добавить новый сериал</h2>
  </div>
  <div class="card-body">
    <form th:action="@{/save/series}" th:object="${series}" method="post">

      <div class="mb-3">
        <label class="form-label fw-bold">Название</label>
        <input type="text" class="form-control" th:field="*{title}" placeholder="Например: Во все тяжкие" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Режиссер(ы)</label>
        <input type="text" class="form-control" th:field="*{directors}" placeholder="Винс Гиллиган">
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Тип</label>
          <select class="form-select" th:field="*{seriesType}">
            <option th:each="type : ${T(com.tracker.mediatracker.model.SeriesType).values()}"
                    th:value="${type}" th:text="${type.title}"></option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Количество серий (Всего)</label>
          <input type="number" class="form-control" th:field="*{totalEpisodes}" placeholder="62">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Год выхода</label>
          <input type="number" class="form-control" th:field="*{releaseYear}" min="1900" max="2100" placeholder="2008">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold text-success">Общая длительность (минут)</label>
          <input type="number" class="form-control" th:field="*{durationMinutes}" placeholder="Пример: 3000 (все сезоны)">
          <div class="form-text">Суммарное время всех эпизодов.</div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Статус</label>
        <select class="form-select" th:field="*{status}">
          <option th:each="st : ${T(com.tracker.mediatracker.model.WatchStatus).values()}"
                  th:value="${st}" th:text="${st.title}"></option>
        </select>
      </div>

      <div class="d-flex justify-content-between">
        <a href="/" class="btn btn-secondary">Отмена</a>
        <button type="submit" class="btn btn-success">Сохранить сериал</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
