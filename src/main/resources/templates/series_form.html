<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Series')}">
</head>
<body class="container mt-5">
<div class="card shadow-sm bg-white">
    <div class="card-header bg-success text-white">
        <h2 class="mb-0" th:text="${series.id == null ? 'Add New Series' : 'Edit Series'}"></h2>
    </div>
    <div class="card-body">
        <form th:action="@{/save/series}" th:object="${series}" method="post">

            <input type="hidden" th:field="*{id}">
            <input type="hidden" name="returnUrl" th:value="${returnUrl}">

            <div class="mb-3 position-relative">
                <label class="form-label fw-bold">Title</label>
                <input type="text" id="title" class="form-control"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                       th:field="*{title}" autocomplete="off" required>
                <div id="tmdbResults" class="list-group position-absolute w-100 shadow d-none"
                     style="z-index: 1000; max-height: 250px; overflow-y: auto;"></div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Director(s)</label>
                <input type="text" class="form-control"
                       th:classappend="${#fields.hasErrors('directors')} ? 'is-invalid'" th:field="*{directors}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('directors')}" th:errors="*{directors}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Series Type</label>
                    <select class="form-select" th:classappend="${#fields.hasErrors('seriesType')} ? 'is-invalid'"
                            th:field="*{seriesType}">
                        <option th:each="type : ${T(com.tracker.mediatracker.model.SeriesType).values()}"
                                th:value="${type}" th:text="${type.title}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('seriesType')}"
                         th:errors="*{seriesType}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Total Episodes</label>
                    <input type="number" class="form-control"
                           th:classappend="${#fields.hasErrors('totalEpisodes')} ? 'is-invalid'"
                           th:field="*{totalEpisodes}">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('totalEpisodes')}"
                         th:errors="*{totalEpisodes}"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Release Year</label>
                    <input type="number" class="form-control"
                           th:classappend="${#fields.hasErrors('releaseYear')} ? 'is-invalid'" th:field="*{releaseYear}"
                           min="1888" max="2100">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('releaseYear')}"
                         th:errors="*{releaseYear}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Episodes Watched</label>
                    <input type="number" class="form-control"
                           th:classappend="${#fields.hasErrors('watchedEpisodes')} ? 'is-invalid'"
                           th:field="*{watchedEpisodes}" placeholder="0">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('watchedEpisodes')}"
                         th:errors="*{watchedEpisodes}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Total Duration (minutes)</label>
                <input type="number" class="form-control"
                       th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid'"
                       th:field="*{durationMinutes}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('durationMinutes')}"
                     th:errors="*{durationMinutes}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" th:field="*{status}">
                    <option th:each="st : ${T(com.tracker.mediatracker.model.WatchStatus).values()}"
                            th:value="${st}" th:text="${st.title}"></option>
                </select>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <div>
                    <a th:href="${returnUrl != null and !returnUrl.isEmpty() ? returnUrl : '/'}"
                       class="btn btn-secondary">Cancel</a>
                    <a th:if="${series.id != null}" th:href="@{'/delete/' + ${series.id}}"
                       class="btn btn-danger ms-2"
                       onclick="return confirm('Are you sure you want to permanently delete this record?')">Delete</a>
                </div>
                <button type="submit" class="btn btn-success px-4">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const statusSelect = document.getElementById('status');
        const watchedInput = document.getElementById('watchedEpisodes');
        const totalInput = document.getElementById('totalEpisodes');
        const titleInput = document.getElementById('title');
        const resultsBox = document.getElementById('tmdbResults');
        const directorsInput = document.getElementById('directors');
        const releaseYearInput = document.getElementById('releaseYear');
        const durationInput = document.getElementById('durationMinutes');

        let timeout = null;

        if (titleInput && resultsBox) {
            titleInput.addEventListener('input', function () {
                clearTimeout(timeout);
                const query = this.value.trim();
                if (query.length < 2) {
                    resultsBox.classList.add('d-none');
                    return;
                }
                timeout = setTimeout(async () => {
                    try {
                        const response = await fetch(`/api/tmdb/search?query=${encodeURIComponent(query)}`);
                        const data = await response.json();
                        const series = (data.results || []).filter(item => item.media_type === 'tv' || item.mediaType === 'tv');

                        resultsBox.innerHTML = '';
                        if (series.length === 0) {
                            resultsBox.classList.add('d-none');
                            return;
                        }

                        series.forEach(show => {
                            const yearStr = show.first_air_date || show.firstAirDate;
                            const year = yearStr ? yearStr.substring(0, 4) : '';
                            const title = show.name || show.title;

                            const btn = document.createElement('button');
                            btn.type = 'button';
                            btn.className = 'list-group-item list-group-item-action';
                            btn.innerHTML = `<strong>${title}</strong> <span class="text-muted">${year ? `(${year})` : ''}</span>`;

                            btn.addEventListener('click', async () => {
                                titleInput.value = title;
                                resultsBox.classList.add('d-none');

                                const res = await fetch(`/api/tmdb/details?id=${show.id}&type=tv`);
                                const details = await res.json();

                                if (details.releaseYear) releaseYearInput.value = details.releaseYear;
                                if (details.durationMinutes) durationInput.value = details.durationMinutes;
                                if (details.directors) directorsInput.value = details.directors;
                                if (details.totalEpisodes) totalInput.value = details.totalEpisodes;

                                syncStatusFromEpisodes();
                            });
                            resultsBox.appendChild(btn);
                        });
                        resultsBox.classList.remove('d-none');
                    } catch (e) {
                        console.error('TMDB search failed', e);
                    }
                }, 500);
            });

            document.addEventListener('click', function (e) {
                if (!titleInput.contains(e.target) && !resultsBox.contains(e.target)) {
                    resultsBox.classList.add('d-none');
                }
            });
        }

        if (!statusSelect || !watchedInput || !totalInput) return;

        let prevStatus = statusSelect.value;

        statusSelect.addEventListener('change', function () {
            const currentStatus = this.value;
            const watched = parseInt(watchedInput.value) || 0;
            const total = parseInt(totalInput.value) || 0;

            if (currentStatus === 'PLANNED' && watched > 0) {
                Swal.fire({
                    title: 'Are you sure?',
                    text: 'Changing status to "Planned" will reset your watched episodes to 0.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#198754',
                    cancelButtonColor: '#6c757d',
                    confirmButtonText: 'Yes, reset it'
                }).then((result) => {
                    if (result.isConfirmed) {
                        watchedInput.value = 0;
                        prevStatus = currentStatus;
                        highlightInput(watchedInput);
                    } else {
                        statusSelect.value = prevStatus;
                    }
                });
                return;
            } else if (currentStatus === 'COMPLETED' && total > 0 && watched < total) {
                watchedInput.value = total;
            } else if ((currentStatus === 'WATCHING' || currentStatus === 'DROPPED') && total > 0 && watched >= total) {
                const statusName = currentStatus === 'WATCHING' ? 'Watching' : 'Dropped';
                Swal.fire({
                    title: 'Episodes Adjusted',
                    text: `You have already watched all episodes. To switch to "${statusName}", the watched count will be decreased.`,
                    icon: 'info',
                    confirmButtonColor: '#0d6efd'
                });
                watchedInput.value = Math.max(0, total - 1);
            }

            prevStatus = currentStatus;
            highlightInput(watchedInput);
        });

        function syncStatusFromEpisodes() {
            const watched = parseInt(watchedInput.value) || 0;
            const total = parseInt(totalInput.value) || 0;

            if (total > 0 && watched >= total) {
                statusSelect.value = 'COMPLETED';
            } else if (watched > 0 && statusSelect.value === 'PLANNED') {
                statusSelect.value = 'WATCHING';
            } else if (watched === 0 && statusSelect.value === 'WATCHING') {
                statusSelect.value = 'PLANNED';
            } else if (statusSelect.value === 'COMPLETED' && watched < total) {
                statusSelect.value = 'WATCHING';
            }

            prevStatus = statusSelect.value;
        }

        watchedInput.addEventListener('input', syncStatusFromEpisodes);
        totalInput.addEventListener('input', syncStatusFromEpisodes);

        function highlightInput(element) {
            element.style.transition = "background-color 0.3s";
            element.style.backgroundColor = "#e8f5e9";
            setTimeout(() => element.style.backgroundColor = "", 600);
        }
    });
</script>

</body>
</html>
